<svg xmlns="http://www.w3.org/2000/svg" id="svg55" width="745.915" height="1175.786" aria-labelledby="title desc" viewBox="0 0 745.915 1175.786"><title id="title">Unresponsive touchscreen troubleshooting flowchart</title><desc id="desc">A troubleshooting flowchart for an unresponsive Wombat touchscreen, followed by an advanced recovery procedure for restoring the default screen configuration.</desc><defs id="defs1"><marker id="arrow" markerHeight="10" markerUnits="strokeWidth" markerWidth="10" orient="auto" refX="7.5" refY="5"><path id="path1" fill="#475569" d="m0 0 10 5-10 5Z"/></marker><style id="style1">.action,.decision{fill:#fff;stroke:#334155;stroke-width:1.8}.decision{fill:#f8fafc;stroke-width:2}.result{fill:#dcfce7;stroke:#166534;stroke-width:1.8}.boxText,.boxTitle{font:700 15px system-ui,-apple-system,&quot;Segoe UI&quot;,Roboto,Arial,sans-serif;fill:#0f172a}.boxText{font:400 14px system-ui,-apple-system,&quot;Segoe UI&quot;,Roboto,Arial,sans-serif}.smallText{font:400 12px system-ui,-apple-system,&quot;Segoe UI&quot;,Roboto,Arial,sans-serif;fill:#334155}.resultText{font:700 14px system-ui,-apple-system,&quot;Segoe UI&quot;,Roboto,Arial,sans-serif;fill:#166534}.labelText{font:700 12px system-ui,-apple-system,&quot;Segoe UI&quot;,Roboto,Arial,sans-serif;fill:#475569}.conn{stroke:#475569;stroke-width:2.2;fill:none}</style></defs><rect id="rect2" width="720" height="88" x="16.686" y=".9" rx="14" style="fill:#e2e8f0;stroke:#334155;stroke-width:1.8"/><text id="text2" x="376.686" y="33.9" style="font:700 24px system-ui,-apple-system,&quot;Segoe UI&quot;,Roboto,Arial,sans-serif;fill:#0f172a;font-style:normal;font-variant:normal;font-weight:700;font-stretch:normal;font-size:24px;line-height:normal;font-family:system-ui,&quot;-apple-system&quot;,&quot;Segoe UI&quot;,Roboto,Arial,sans-serif" text-anchor="middle">Unresponsive touchscreen</text><text id="text3" x="376.686" y="59.9" style="font:400 14px system-ui,-apple-system,&quot;Segoe UI&quot;,Roboto,Arial,sans-serif;fill:#334155;font-style:normal;font-variant:normal;font-weight:400;font-stretch:normal;font-size:14px;line-height:normal;font-family:system-ui,&quot;-apple-system&quot;,&quot;Segoe UI&quot;,Roboto,Arial,sans-serif" text-anchor="middle">The touchscreen is not responding to your inputs</text><rect id="rect3" width="363.332" height="58.383" x=".75" y="106.708" rx="6.606" style="fill:#f8fafc;stroke:#334155;stroke-width:1.5"/><text id="text4" x="189.885" y="130.9" class="boxText" style="font-style:normal;font-variant:normal;font-weight:400;font-stretch:normal;font-size:14px;line-height:normal;font-family:system-ui,&quot;-apple-system&quot;,&quot;Segoe UI&quot;,Roboto,Arial,sans-serif" text-anchor="middle">Try the quick checks below in order.</text><text id="text5" x="181.485" y="149.9" class="smallText" style="font-style:normal;font-variant:normal;font-weight:400;font-stretch:normal;font-size:12px;line-height:normal;font-family:system-ui,&quot;-apple-system&quot;,&quot;Segoe UI&quot;,Roboto,Arial,sans-serif" text-anchor="middle">Stop as soon as the touchscreen becomes responsive again.</text><rect id="rect5" width="440" height="52" x="156.686" y="190.9" rx="18" style="fill:#e0f2fe;stroke:#0369a1;stroke-width:2"/><text id="text6" x="376.686" y="221.9" class="boxTitle" style="font-style:normal;font-variant:normal;font-weight:700;font-stretch:normal;font-size:15px;line-height:normal;font-family:system-ui,&quot;-apple-system&quot;,&quot;Segoe UI&quot;,Roboto,Arial,sans-serif" text-anchor="middle">Touchscreen does not respond</text><path id="line6" marker-end="url(#arrow)" d="M376.686 242.9v28" class="conn"/><rect id="rect6" width="460" height="70" x="136.686" y="270.9" class="action" rx="14"/><text id="text7" x="366.686" y="297.9" class="boxTitle" style="font-style:normal;font-variant:normal;font-weight:700;font-stretch:normal;font-size:15px;line-height:normal;font-family:system-ui,&quot;-apple-system&quot;,&quot;Segoe UI&quot;,Roboto,Arial,sans-serif" text-anchor="middle">Loosen each case screw by 3–4 turns</text><text id="text8" x="366.686" y="318.9" class="boxText" style="font-style:normal;font-variant:normal;font-weight:400;font-stretch:normal;font-size:14px;line-height:normal;font-family:system-ui,&quot;-apple-system&quot;,&quot;Segoe UI&quot;,Roboto,Arial,sans-serif" text-anchor="middle">Then test the touchscreen again.</text><rect id="rect8" width="363.157" height="58.208" x="381.958" y="106.796" rx="9.079" style="fill:#fef3c7;stroke:#b45309;stroke-width:1.6"/><text id="text9" x="397.786" y="138.4" class="boxTitle" style="font-style:normal;font-variant:normal;font-weight:700;font-stretch:normal;font-size:15px;line-height:normal;font-family:system-ui,&quot;-apple-system&quot;,&quot;Segoe UI&quot;,Roboto,Arial,sans-serif">Warranty note</text><text id="text10" x="513.987" y="132.2" style="font:400 12px system-ui,-apple-system,&quot;Segoe UI&quot;,Roboto,Arial,sans-serif;fill:#7c2d12;font-style:normal;font-variant:normal;font-weight:400;font-stretch:normal;font-size:12px;line-height:normal;font-family:system-ui,&quot;-apple-system&quot;,&quot;Segoe UI&quot;,Roboto,Arial,sans-serif"><tspan id="tspan56" x="513.987" y="132.2">Do not loosen the screws too much.</tspan><tspan id="tspan57" x="513.987" y="147.2">Opening the case will void your warranty.</tspan></text><path id="line10" marker-end="url(#arrow)" d="M376.686 340.9v39.917" class="conn"/><rect id="rect10" width="343.658" height="57.997" x="181.706" y="382.82" class="decision" rx="16.662"/><text id="text11" x="346.686" y="407.8" class="boxTitle" style="font-style:normal;font-variant:normal;font-weight:700;font-stretch:normal;font-size:15px;line-height:normal;font-family:system-ui,&quot;-apple-system&quot;,&quot;Segoe UI&quot;,Roboto,Arial,sans-serif" text-anchor="middle">Responsive now?</text><text id="text12" x="346.686" y="426.8" class="smallText" style="font-style:normal;font-variant:normal;font-weight:400;font-stretch:normal;font-size:12px;line-height:normal;font-family:system-ui,&quot;-apple-system&quot;,&quot;Segoe UI&quot;,Roboto,Arial,sans-serif" text-anchor="middle">If the case was too tight, this often fixes it.</text><rect id="rect12" width="130" height="38" x="576.686" y="392.8" class="result" rx="19"/><text id="text13" x="641.686" y="416.8" class="resultText" style="font-style:normal;font-variant:normal;font-weight:700;font-stretch:normal;font-size:14px;line-height:normal;font-family:system-ui,&quot;-apple-system&quot;,&quot;Segoe UI&quot;,Roboto,Arial,sans-serif" text-anchor="middle">Resolved</text><path id="line13" marker-end="url(#arrow)" d="M524.386 410.374h49.013" class="conn"/><text id="text14" x="544.985" y="402.8" class="labelText" style="font-style:normal;font-variant:normal;font-weight:700;font-stretch:normal;font-size:12px;line-height:normal;font-family:system-ui,&quot;-apple-system&quot;,&quot;Segoe UI&quot;,Roboto,Arial,sans-serif" text-anchor="middle">Yes</text><text id="text15" x="390.686" y="456.8" class="labelText" style="font-style:normal;font-variant:normal;font-weight:700;font-stretch:normal;font-size:12px;line-height:normal;font-family:system-ui,&quot;-apple-system&quot;,&quot;Segoe UI&quot;,Roboto,Arial,sans-serif" text-anchor="start">No</text><path id="line15" marker-end="url(#arrow)" d="M376.686 440.8v42.001" class="conn"/><rect id="rect15" width="460" height="70" x="136.686" y="482.801" class="action" rx="14"/><text id="text16" x="366.686" y="509.801" class="boxTitle" style="font-style:normal;font-variant:normal;font-weight:700;font-stretch:normal;font-size:15px;line-height:normal;font-family:system-ui,&quot;-apple-system&quot;,&quot;Segoe UI&quot;,Roboto,Arial,sans-serif" text-anchor="middle">Stop touching the screen and wait 1–2 minutes</text><text id="text17" x="366.686" y="530.801" class="boxText" style="font-style:normal;font-variant:normal;font-weight:400;font-stretch:normal;font-size:14px;line-height:normal;font-family:system-ui,&quot;-apple-system&quot;,&quot;Segoe UI&quot;,Roboto,Arial,sans-serif" text-anchor="middle">If BotUI is overloaded, it may recover on its own.</text><path id="line17" marker-end="url(#arrow)" d="M376.686 552.801v30" class="conn"/><rect id="rect17" width="353.144" height="57.969" x="172.207" y="582.823" class="decision" rx="17.122"/><text id="text18" x="346.686" y="607.801" class="boxTitle" style="font-style:normal;font-variant:normal;font-weight:700;font-stretch:normal;font-size:15px;line-height:normal;font-family:system-ui,&quot;-apple-system&quot;,&quot;Segoe UI&quot;,Roboto,Arial,sans-serif" text-anchor="middle">Responsive now?</text><text id="text19" x="346.686" y="626.801" class="smallText" style="font-style:normal;font-variant:normal;font-weight:400;font-stretch:normal;font-size:12px;line-height:normal;font-family:system-ui,&quot;-apple-system&quot;,&quot;Segoe UI&quot;,Roboto,Arial,sans-serif" text-anchor="middle">Too many fast inputs can temporarily make BotUI unresponsive.</text><rect id="rect19" width="130" height="38" x="576.686" y="592.801" class="result" rx="19"/><text id="text20" x="641.686" y="616.801" class="resultText" style="font-style:normal;font-variant:normal;font-weight:700;font-stretch:normal;font-size:14px;line-height:normal;font-family:system-ui,&quot;-apple-system&quot;,&quot;Segoe UI&quot;,Roboto,Arial,sans-serif" text-anchor="middle">Resolved</text><path id="line20" marker-end="url(#arrow)" d="M524.386 611.283h49.013" class="conn"/><text id="text21" x="544.985" y="602.801" class="labelText" style="font-style:normal;font-variant:normal;font-weight:700;font-stretch:normal;font-size:12px;line-height:normal;font-family:system-ui,&quot;-apple-system&quot;,&quot;Segoe UI&quot;,Roboto,Arial,sans-serif" text-anchor="middle">Yes</text><text id="text22" x="390.686" y="656.801" class="labelText" style="font-style:normal;font-variant:normal;font-weight:700;font-stretch:normal;font-size:12px;line-height:normal;font-family:system-ui,&quot;-apple-system&quot;,&quot;Segoe UI&quot;,Roboto,Arial,sans-serif" text-anchor="start">No</text><path id="line22" marker-end="url(#arrow)" d="M376.686 640.801v42" class="conn"/><rect id="rect22" width="500" height="84" x="116.686" y="682.801" class="action" rx="14"/><text id="text23" x="366.686" y="709.801" class="boxTitle" style="font-style:normal;font-variant:normal;font-weight:700;font-stretch:normal;font-size:15px;line-height:normal;font-family:system-ui,&quot;-apple-system&quot;,&quot;Segoe UI&quot;,Roboto,Arial,sans-serif" text-anchor="middle">Check your WombatOS version and update if needed</text><text id="text24" x="366.686" y="730.801" class="boxText" style="font-style:normal;font-variant:normal;font-weight:400;font-stretch:normal;font-size:14px;line-height:normal;font-family:system-ui,&quot;-apple-system&quot;,&quot;Segoe UI&quot;,Roboto,Arial,sans-serif" text-anchor="middle"><tspan id="tspan58" x="366.686" y="730.801">Wi-Fi-heavy environments can worsen this problem on some versions</tspan><tspan id="tspan59" x="366.686" y="748.301">prior to 31.2.0.</tspan></text><path id="line25" marker-end="url(#arrow)" d="M376.686 766.801v32" class="conn"/><rect id="rect25" width="343.658" height="57.997" x="181.706" y="798.796" class="decision" rx="16.662"/><text id="text26" x="346.686" y="823.801" class="boxTitle" style="font-style:normal;font-variant:normal;font-weight:700;font-stretch:normal;font-size:15px;line-height:normal;font-family:system-ui,&quot;-apple-system&quot;,&quot;Segoe UI&quot;,Roboto,Arial,sans-serif" text-anchor="middle">Responsive after updating?</text><text id="text27" x="346.686" y="842.801" class="smallText" style="font-style:normal;font-variant:normal;font-weight:400;font-stretch:normal;font-size:12px;line-height:normal;font-family:system-ui,&quot;-apple-system&quot;,&quot;Segoe UI&quot;,Roboto,Arial,sans-serif" text-anchor="middle">Use the WombatOS page to confirm or update firmware.</text><rect id="rect27" width="130" height="38" x="576.686" y="808.801" class="result" rx="19"/><text id="text28" x="641.686" y="832.801" class="resultText" style="font-style:normal;font-variant:normal;font-weight:700;font-stretch:normal;font-size:14px;line-height:normal;font-family:system-ui,&quot;-apple-system&quot;,&quot;Segoe UI&quot;,Roboto,Arial,sans-serif" text-anchor="middle">Resolved</text><path id="line28" marker-end="url(#arrow)" d="M524.386 828.265h49.013" class="conn"/><text id="text29" x="544.985" y="818.801" class="labelText" style="font-style:normal;font-variant:normal;font-weight:700;font-stretch:normal;font-size:12px;line-height:normal;font-family:system-ui,&quot;-apple-system&quot;,&quot;Segoe UI&quot;,Roboto,Arial,sans-serif" text-anchor="middle">Yes</text><text id="text30" x="390.686" y="872.801" class="labelText" style="font-style:normal;font-variant:normal;font-weight:700;font-stretch:normal;font-size:12px;line-height:normal;font-family:system-ui,&quot;-apple-system&quot;,&quot;Segoe UI&quot;,Roboto,Arial,sans-serif" text-anchor="start">No</text><path id="line30" marker-end="url(#arrow)" d="M376.686 856.801v42" class="conn"/><rect id="rect30" width="520" height="82" x="106.686" y="898.801" class="action" rx="14"/><text id="text31" x="366.686" y="925.801" class="boxTitle" style="font-style:normal;font-variant:normal;font-weight:700;font-stretch:normal;font-size:15px;line-height:normal;font-family:system-ui,&quot;-apple-system&quot;,&quot;Segoe UI&quot;,Roboto,Arial,sans-serif" text-anchor="middle">Try screen-configuration recovery</text><text id="text32" x="366.686" y="946.801" class="boxText" style="font-style:normal;font-variant:normal;font-weight:400;font-stretch:normal;font-size:14px;line-height:normal;font-family:system-ui,&quot;-apple-system&quot;,&quot;Segoe UI&quot;,Roboto,Arial,sans-serif" text-anchor="middle">Either reflash the Wombat after backing up your programs,</text><text id="text33" x="366.686" y="965.801" class="boxText" style="font-style:normal;font-variant:normal;font-weight:400;font-stretch:normal;font-size:14px;line-height:normal;font-family:system-ui,&quot;-apple-system&quot;,&quot;Segoe UI&quot;,Roboto,Arial,sans-serif" text-anchor="middle">or use the advanced recovery procedure below.</text><path id="line33" marker-end="url(#arrow)" d="M376.686 980.801v30" class="conn"/><rect id="rect33" width="343.658" height="57.997" x="181.706" y="1010.784" class="decision" rx="16.662"/><text id="text34" x="346.686" y="1035.801" class="boxTitle" style="font-style:normal;font-variant:normal;font-weight:700;font-stretch:normal;font-size:15px;line-height:normal;font-family:system-ui,&quot;-apple-system&quot;,&quot;Segoe UI&quot;,Roboto,Arial,sans-serif" text-anchor="middle">Responsive after recovery?</text><text id="text35" x="346.686" y="1054.801" class="smallText" style="font-style:normal;font-variant:normal;font-weight:400;font-stretch:normal;font-size:12px;line-height:normal;font-family:system-ui,&quot;-apple-system&quot;,&quot;Segoe UI&quot;,Roboto,Arial,sans-serif" text-anchor="middle">A bogus screen configuration can block touch input.</text><rect id="rect35" width="130" height="38" x="576.686" y="1020.801" class="result" rx="19"/><text id="text36" x="641.686" y="1044.801" class="resultText" style="font-style:normal;font-variant:normal;font-weight:700;font-stretch:normal;font-size:14px;line-height:normal;font-family:system-ui,&quot;-apple-system&quot;,&quot;Segoe UI&quot;,Roboto,Arial,sans-serif" text-anchor="middle">Resolved</text><path id="line36" marker-end="url(#arrow)" d="M524.386 1041.228h49.013" class="conn"/><text id="text37" x="544.985" y="1030.801" class="labelText" style="font-style:normal;font-variant:normal;font-weight:700;font-stretch:normal;font-size:12px;line-height:normal;font-family:system-ui,&quot;-apple-system&quot;,&quot;Segoe UI&quot;,Roboto,Arial,sans-serif" text-anchor="middle">Yes</text><text id="text38" x="390.686" y="1084.801" class="labelText" style="font-style:normal;font-variant:normal;font-weight:700;font-stretch:normal;font-size:12px;line-height:normal;font-family:system-ui,&quot;-apple-system&quot;,&quot;Segoe UI&quot;,Roboto,Arial,sans-serif" text-anchor="start">No</text><path id="line38" marker-end="url(#arrow)" d="M376.686 1068.801v36" class="conn"/><rect id="rect38" width="467.37" height="69.97" x="140.201" y="1104.816" rx="18.547" style="fill:#fee2e2;stroke:#b91c1c;stroke-width:2"/><text id="text39" x="376.686" y="1131.801" class="boxTitle" style="font-style:normal;font-variant:normal;font-weight:700;font-stretch:normal;font-size:15px;line-height:normal;font-family:system-ui,&quot;-apple-system&quot;,&quot;Segoe UI&quot;,Roboto,Arial,sans-serif" text-anchor="middle">Possible broken touchscreen</text><text id="text40" x="376.686" y="1152.801" style="font:400 14px system-ui,-apple-system,&quot;Segoe UI&quot;,Roboto,Arial,sans-serif;fill:#7f1d1d;font-style:normal;font-variant:normal;font-weight:400;font-stretch:normal;font-size:14px;line-height:normal;font-family:system-ui,&quot;-apple-system&quot;,&quot;Segoe UI&quot;,Roboto,Arial,sans-serif" text-anchor="middle">Email support@kipr.org so the support team can create a repair ticket.</text></svg>