<svg xmlns="http://www.w3.org/2000/svg" id="svg40" width="721.8" height="897.9" aria-labelledby="title desc" viewBox="0 0 721.8 897.9"><title id="title">Boot and power troubleshooting flowchart</title><desc id="desc">A troubleshooting flowchart for a KIPR controller that will not turn on or turns off randomly. Check the red power light, then follow the powered or unpowered branch.</desc><defs id="defs1"><marker id="arrow" markerHeight="10" markerUnits="strokeWidth" markerWidth="10" orient="auto" refX="7.5" refY="5"><path id="path1" fill="#475569" d="m0 0 10 5-10 5Z"/></marker><style id="style1">.action,.decision{fill:#fff;stroke:#334155;stroke-width:1.8}.decision{fill:#f8fafc;stroke-width:2}.result{fill:#dcfce7;stroke:#166534;stroke-width:1.8}.note{fill:#eff6ff;stroke:#1d4ed8;stroke-width:1.4}.support{fill:#fee2e2;stroke:#b91c1c;stroke-width:2}.boxText,.boxTitle{font:700 15px system-ui,-apple-system,&quot;Segoe UI&quot;,Roboto,Arial,sans-serif;fill:#0f172a}.boxText{font:400 14px system-ui,-apple-system,&quot;Segoe UI&quot;,Roboto,Arial,sans-serif}.smallText{font:400 12px system-ui,-apple-system,&quot;Segoe UI&quot;,Roboto,Arial,sans-serif;fill:#334155}.supportText{font:400 13px system-ui,-apple-system,&quot;Segoe UI&quot;,Roboto,Arial,sans-serif;fill:#7f1d1d}.resultText{font:700 13px system-ui,-apple-system,&quot;Segoe UI&quot;,Roboto,Arial,sans-serif;fill:#166534}.labelText{font:700 12px system-ui,-apple-system,&quot;Segoe UI&quot;,Roboto,Arial,sans-serif;fill:#475569}.conn{stroke:#475569;stroke-width:2.2;fill:none}a:hover .action{fill:#f8fafc;stroke:#0369a1}</style></defs><rect id="rect2" width="720" height="88" x=".9" y=".9" rx="14" style="fill:#e2e8f0;stroke:#334155;stroke-width:1.8"/><text id="text2" x="360.9" y="34.9" style="font:700 24px system-ui,-apple-system,&quot;Segoe UI&quot;,Roboto,Arial,sans-serif;fill:#0f172a;font-style:normal;font-variant:normal;font-weight:700;font-stretch:normal;font-size:24px;line-height:normal;font-family:system-ui,&quot;-apple-system&quot;,&quot;Segoe UI&quot;,Roboto,Arial,sans-serif" text-anchor="middle">Boot and power</text><text id="text3" x="360.9" y="60.9" style="font:400 14px system-ui,-apple-system,&quot;Segoe UI&quot;,Roboto,Arial,sans-serif;fill:#334155;font-style:normal;font-variant:normal;font-weight:400;font-stretch:normal;font-size:14px;line-height:normal;font-family:system-ui,&quot;-apple-system&quot;,&quot;Segoe UI&quot;,Roboto,Arial,sans-serif" text-anchor="middle">Controller won&apos;t turn on or turns off randomly</text><rect id="rect3" width="600" height="72" x="60.9" y="106.9" rx="12" style="fill:#f8fafc;stroke:#334155;stroke-width:1.5"/><text id="text4" x="360.9" y="135.9" class="boxText" style="font-style:normal;font-variant:normal;font-weight:400;font-stretch:normal;font-size:14px;line-height:normal;font-family:system-ui,&quot;-apple-system&quot;,&quot;Segoe UI&quot;,Roboto,Arial,sans-serif" text-anchor="middle">Turn the controller&apos;s power switch on.</text><text id="text5" x="360.9" y="158.9" class="smallText" style="font-style:normal;font-variant:normal;font-weight:400;font-stretch:normal;font-size:12px;line-height:normal;font-family:system-ui,&quot;-apple-system&quot;,&quot;Segoe UI&quot;,Roboto,Arial,sans-serif" text-anchor="middle">Look for the red power light in the bottom-right corner.</text><rect id="rect5" width="440" height="56" x="140.9" y="200.9" rx="18" style="fill:#e0f2fe;stroke:#0369a1;stroke-width:2"/><text id="text6" x="360.9" y="233.9" class="boxTitle" style="font-style:normal;font-variant:normal;font-weight:700;font-stretch:normal;font-size:15px;line-height:normal;font-family:system-ui,&quot;-apple-system&quot;,&quot;Segoe UI&quot;,Roboto,Arial,sans-serif" text-anchor="middle">Controller does not boot or shuts off unexpectedly</text><path id="line6" marker-end="url(#arrow)" d="M360.9 256.9v32" class="conn"/><rect id="rect6" width="360" height="70" x="180.9" y="294.9" class="decision" rx="18"/><circle id="circle6" cx="250.9" cy="322.9" r="7" fill="#dc2626" stroke="#991b1b" stroke-width="1.5"/><text id="text7" x="370.9" y="327.9" class="boxTitle" style="font-style:normal;font-variant:normal;font-weight:700;font-stretch:normal;font-size:15px;line-height:normal;font-family:system-ui,&quot;-apple-system&quot;,&quot;Segoe UI&quot;,Roboto,Arial,sans-serif" text-anchor="middle">Is the red power light on?</text><text id="text8" x="360.9" y="348.9" class="smallText" style="font-style:normal;font-variant:normal;font-weight:400;font-stretch:normal;font-size:12px;line-height:normal;font-family:system-ui,&quot;-apple-system&quot;,&quot;Segoe UI&quot;,Roboto,Arial,sans-serif" text-anchor="middle">This separates boot problems from power-delivery problems.</text><path id="path8" marker-end="url(#arrow)" d="M360.9 364.9v26h-180v18" class="conn"/><path id="path9" marker-end="url(#arrow)" d="M360.9 390.9h180v18" class="conn"/><text id="text9" x="266.9" y="384.9" class="labelText" style="font-style:normal;font-variant:normal;font-weight:700;font-stretch:normal;font-size:12px;line-height:normal;font-family:system-ui,&quot;-apple-system&quot;,&quot;Segoe UI&quot;,Roboto,Arial,sans-serif" text-anchor="middle">Yes</text><text id="text10" x="454.9" y="384.9" class="labelText" style="font-style:normal;font-variant:normal;font-weight:700;font-stretch:normal;font-size:12px;line-height:normal;font-family:system-ui,&quot;-apple-system&quot;,&quot;Segoe UI&quot;,Roboto,Arial,sans-serif" text-anchor="middle">No</text><rect id="rect10" width="320" height="68" x="20.9" y="414.9" class="note" rx="13"/><circle id="circle10" cx="50.9" cy="438.9" r="7" fill="#dc2626" stroke="#991b1b" stroke-width="1.5"/><text id="text11" x="180.9" y="441.9" class="boxTitle" style="font-style:normal;font-variant:normal;font-weight:700;font-stretch:normal;font-size:15px;line-height:normal;font-family:system-ui,&quot;-apple-system&quot;,&quot;Segoe UI&quot;,Roboto,Arial,sans-serif" text-anchor="middle">Red light on</text><text id="text12" x="180.9" y="463.9" class="smallText" style="font-style:normal;font-variant:normal;font-weight:400;font-stretch:normal;font-size:12px;line-height:normal;font-family:system-ui,&quot;-apple-system&quot;,&quot;Segoe UI&quot;,Roboto,Arial,sans-serif" text-anchor="middle">The board is properly receiving power.</text><path id="line12" marker-end="url(#arrow)" d="M180.9 482.9v16" class="conn"/><a id="a14" target="_top" transform="translate(-19.1 -15.1)">
    <rect id="rect12" width="300" height="60" x="50" y="520" class="action" rx="14"/>
    <text id="text13" x="200" y="546" class="boxTitle" style="font-style:normal;font-variant:normal;font-weight:700;font-stretch:normal;font-size:15px;line-height:normal;font-family:system-ui,&quot;-apple-system&quot;,&quot;Segoe UI&quot;,Roboto,Arial,sans-serif" text-anchor="middle">1. Back up your programs</text>
    <text id="text14" x="200" y="566" class="smallText" style="font-style:normal;font-variant:normal;font-weight:400;font-stretch:normal;font-size:12px;line-height:normal;font-family:system-ui,&quot;-apple-system&quot;,&quot;Segoe UI&quot;,Roboto,Arial,sans-serif" text-anchor="middle">Save your work before changing the SD card.</text>
  </a><path id="line14" marker-end="url(#arrow)" d="M180.9 564.9v24" class="conn"/><a id="a17" target="_top" transform="translate(-19.1 -15.1)">
    <rect id="rect14" width="300" height="80" x="50" y="610" class="action" rx="14"/>
    <text id="text15" x="200" y="638" class="boxTitle" style="font-style:normal;font-variant:normal;font-weight:700;font-stretch:normal;font-size:15px;line-height:normal;font-family:system-ui,&quot;-apple-system&quot;,&quot;Segoe UI&quot;,Roboto,Arial,sans-serif" text-anchor="middle">2. Write a fresh image to the SD card</text>
    <text id="text16" x="200" y="660" class="boxText" style="font-style:normal;font-variant:normal;font-weight:400;font-stretch:normal;font-size:14px;line-height:normal;font-family:system-ui,&quot;-apple-system&quot;,&quot;Segoe UI&quot;,Roboto,Arial,sans-serif" text-anchor="middle">Reflash the controller firmware.</text>
    <text id="text17" x="200" y="678" class="smallText" style="font-style:normal;font-variant:normal;font-weight:400;font-stretch:normal;font-size:12px;line-height:normal;font-family:system-ui,&quot;-apple-system&quot;,&quot;Segoe UI&quot;,Roboto,Arial,sans-serif" text-anchor="middle">Then test the controller again.</text>
  </a><path id="line17" marker-end="url(#arrow)" d="M180.9 674.9v24" class="conn"/><rect id="rect17" width="200" height="64" x="25.9" y="704.9" class="decision" rx="17"/><text id="text18" x="125.9" y="732.9" class="boxTitle" style="font-style:normal;font-variant:normal;font-weight:700;font-stretch:normal;font-size:15px;line-height:normal;font-family:system-ui,&quot;-apple-system&quot;,&quot;Segoe UI&quot;,Roboto,Arial,sans-serif" text-anchor="middle">Problem fixed?</text><text id="text19" x="125.9" y="752.9" class="smallText" style="font-style:normal;font-variant:normal;font-weight:400;font-stretch:normal;font-size:12px;line-height:normal;font-family:system-ui,&quot;-apple-system&quot;,&quot;Segoe UI&quot;,Roboto,Arial,sans-serif" text-anchor="middle">Try powering on once more.</text><path id="line19" marker-end="url(#arrow)" d="M226.9 736.9h28.018" class="conn"/><text id="text20" x="249.5" y="725.9" class="labelText" style="font-style:normal;font-variant:normal;font-weight:700;font-stretch:normal;font-size:12px;line-height:normal;font-family:system-ui,&quot;-apple-system&quot;,&quot;Segoe UI&quot;,Roboto,Arial,sans-serif" text-anchor="middle">Yes</text><rect id="rect20" width="85" height="38" x="262.5" y="717.9" class="result" rx="19"/><text id="text21" x="305" y="741.9" class="resultText" style="font-style:normal;font-variant:normal;font-weight:700;font-stretch:normal;font-size:13px;line-height:normal;font-family:system-ui,&quot;-apple-system&quot;,&quot;Segoe UI&quot;,Roboto,Arial,sans-serif" text-anchor="middle">Resolved</text><path id="line21" marker-end="url(#arrow)" d="M125.9 768.9v40" class="conn"/><text id="text22" x="139.9" y="790.9" class="labelText" style="font-style:normal;font-variant:normal;font-weight:700;font-stretch:normal;font-size:12px;line-height:normal;font-family:system-ui,&quot;-apple-system&quot;,&quot;Segoe UI&quot;,Roboto,Arial,sans-serif">No</text><rect id="rect22" width="300" height="82" x="30.9" y="814.9" class="support" rx="18"/><text id="text23" x="180.9" y="841.9" class="boxTitle" style="font-style:normal;font-variant:normal;font-weight:700;font-stretch:normal;font-size:15px;line-height:normal;font-family:system-ui,&quot;-apple-system&quot;,&quot;Segoe UI&quot;,Roboto,Arial,sans-serif" text-anchor="middle">Possible screen hardware issue</text><text id="text24" x="180.9" y="864.9" class="supportText" style="font-style:normal;font-variant:normal;font-weight:400;font-stretch:normal;font-size:13px;line-height:normal;font-family:system-ui,&quot;-apple-system&quot;,&quot;Segoe UI&quot;,Roboto,Arial,sans-serif" text-anchor="middle">Email support@kipr.org so the support team</text><text id="text25" x="180.9" y="882.9" class="supportText" style="font-style:normal;font-variant:normal;font-weight:400;font-stretch:normal;font-size:13px;line-height:normal;font-family:system-ui,&quot;-apple-system&quot;,&quot;Segoe UI&quot;,Roboto,Arial,sans-serif" text-anchor="middle">can create a repair ticket.</text><rect id="rect25" width="320" height="68" x="380.9" y="414.9" class="note" rx="13"/><circle id="circle25" cx="410.9" cy="438.9" r="7" fill="#fff" stroke="#94a3b8" stroke-width="2"/><text id="text26" x="540.9" y="441.9" class="boxTitle" style="font-style:normal;font-variant:normal;font-weight:700;font-stretch:normal;font-size:15px;line-height:normal;font-family:system-ui,&quot;-apple-system&quot;,&quot;Segoe UI&quot;,Roboto,Arial,sans-serif" text-anchor="middle">Red light off</text><text id="text27" x="540.9" y="463.9" class="smallText" style="font-style:normal;font-variant:normal;font-weight:400;font-stretch:normal;font-size:12px;line-height:normal;font-family:system-ui,&quot;-apple-system&quot;,&quot;Segoe UI&quot;,Roboto,Arial,sans-serif" text-anchor="middle">Start by checking the battery.</text><path id="line27" marker-end="url(#arrow)" d="M540.9 484.403v81.823" class="conn" style="stroke-width:2.2;stroke-dasharray:none"/><rect id="rect27" width="300" height="80" x="390.9" y="568.099" class="action" rx="14"/><text id="text28" x="540.9" y="597.099" class="boxTitle" style="font-style:normal;font-variant:normal;font-weight:700;font-stretch:normal;font-size:15px;line-height:normal;font-family:system-ui,&quot;-apple-system&quot;,&quot;Segoe UI&quot;,Roboto,Arial,sans-serif" text-anchor="middle">Try a fully charged battery</text><text id="text29" x="540.9" y="619.099" class="boxText" style="font-style:normal;font-variant:normal;font-weight:400;font-stretch:normal;font-size:14px;line-height:normal;font-family:system-ui,&quot;-apple-system&quot;,&quot;Segoe UI&quot;,Roboto,Arial,sans-serif" text-anchor="middle">Confirm the battery is fully charged,</text><text id="text30" x="540.9" y="637.099" class="smallText" style="font-style:normal;font-variant:normal;font-weight:400;font-stretch:normal;font-size:12px;line-height:normal;font-family:system-ui,&quot;-apple-system&quot;,&quot;Segoe UI&quot;,Roboto,Arial,sans-serif" text-anchor="middle">then test the controller again.</text><path id="line30" marker-end="url(#arrow)" d="M540.9 647.584v55.748" class="conn" style="stroke-width:1.52867;stroke-dasharray:none"/><rect id="rect32" width="200" height="64" x="385.9" y="704.9" class="decision" rx="17"/><text id="text33" x="485.9" y="732.9" class="boxTitle" style="font-style:normal;font-variant:normal;font-weight:700;font-stretch:normal;font-size:15px;line-height:normal;font-family:system-ui,&quot;-apple-system&quot;,&quot;Segoe UI&quot;,Roboto,Arial,sans-serif" text-anchor="middle">Problem fixed?</text><text id="text34" x="485.9" y="752.9" class="smallText" style="font-style:normal;font-variant:normal;font-weight:400;font-stretch:normal;font-size:12px;line-height:normal;font-family:system-ui,&quot;-apple-system&quot;,&quot;Segoe UI&quot;,Roboto,Arial,sans-serif" text-anchor="middle">Check the red light again.</text><path id="line34" marker-end="url(#arrow)" d="M585.9 736.9h26.907" class="conn"/><text id="text35" x="606.6" y="725.9" class="labelText" style="font-style:normal;font-variant:normal;font-weight:700;font-stretch:normal;font-size:12px;line-height:normal;font-family:system-ui,&quot;-apple-system&quot;,&quot;Segoe UI&quot;,Roboto,Arial,sans-serif" text-anchor="middle">Yes</text><rect id="rect35" width="85" height="38" x="619.6" y="717.9" class="result" rx="19"/><text id="text36" x="662.1" y="741.9" class="resultText" style="font-style:normal;font-variant:normal;font-weight:700;font-stretch:normal;font-size:13px;line-height:normal;font-family:system-ui,&quot;-apple-system&quot;,&quot;Segoe UI&quot;,Roboto,Arial,sans-serif" text-anchor="middle">Resolved</text><path id="line36" marker-end="url(#arrow)" d="M485.9 768.9v40" class="conn"/><text id="text37" x="499.9" y="790.9" class="labelText" style="font-style:normal;font-variant:normal;font-weight:700;font-stretch:normal;font-size:12px;line-height:normal;font-family:system-ui,&quot;-apple-system&quot;,&quot;Segoe UI&quot;,Roboto,Arial,sans-serif">No</text><rect id="rect37" width="300" height="82" x="390.9" y="814.9" class="support" rx="18"/><text id="text38" x="540.9" y="841.9" class="boxTitle" style="font-style:normal;font-variant:normal;font-weight:700;font-stretch:normal;font-size:15px;line-height:normal;font-family:system-ui,&quot;-apple-system&quot;,&quot;Segoe UI&quot;,Roboto,Arial,sans-serif" text-anchor="middle">Controller power-system issue</text><text id="text39" x="540.9" y="864.9" class="supportText" style="font-style:normal;font-variant:normal;font-weight:400;font-stretch:normal;font-size:13px;line-height:normal;font-family:system-ui,&quot;-apple-system&quot;,&quot;Segoe UI&quot;,Roboto,Arial,sans-serif" text-anchor="middle">Email support@kipr.org so the support team</text><text id="text40" x="540.9" y="882.9" class="supportText" style="font-style:normal;font-variant:normal;font-weight:400;font-stretch:normal;font-size:13px;line-height:normal;font-family:system-ui,&quot;-apple-system&quot;,&quot;Segoe UI&quot;,Roboto,Arial,sans-serif" text-anchor="middle">can create a repair ticket.</text></svg>