       x="200"
       y="660"
       text-anchor="middle"
       id="text16">Reflash the controller firmware.</text>
    <text
       class="smallText"
       x="200"
       y="678"
       text-anchor="middle"
       id="text17">Then test the controller again.</text>
  </a>
