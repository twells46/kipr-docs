     x="160"
     y="216"
     width="440"
     height="56"
     rx="18"
     id="rect5" />
  <text
     class="boxTitle"
     x="380"
     y="249"
     text-anchor="middle"
     id="text6">Controller does not boot or shuts off unexpectedly</text>
