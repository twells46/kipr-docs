     y="151"
     text-anchor="middle"
     id="text4">Turn the controller's power switch on.</text>
  <text
     class="smallText"
     x="380"
     y="174"
     text-anchor="middle"
     id="text5">Look for the red power light in the bottom-right corner.</text>
  <rect
