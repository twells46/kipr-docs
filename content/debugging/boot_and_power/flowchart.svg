  <title
     id="title">Boot and power troubleshooting flowchart</title>
  <desc
     id="desc">A troubleshooting flowchart for a KIPR controller that will not turn on or turns off randomly. Check the red power light, then follow the powered or unpowered branch.</desc>
  <defs
     id="defs1">
    <style
       id="style1">
      .bg { fill: #ffffff; }
      .frame { fill: #f8fafc; stroke: #334155; stroke-width: 1.5; }
      .header { fill: #e2e8f0; stroke: #334155; stroke-width: 1.8; }
      .start { fill: #e0f2fe; stroke: #0369a1; stroke-width: 2; }
      .action { fill: #ffffff; stroke: #334155; stroke-width: 1.8; }
      .decision { fill: #f8fafc; stroke: #334155; stroke-width: 2; }
      .result { fill: #dcfce7; stroke: #166534; stroke-width: 1.8; }
      .warning { fill: #fef3c7; stroke: #b45309; stroke-width: 1.6; }
      .note { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 1.4; }
      .support { fill: #fee2e2; stroke: #b91c1c; stroke-width: 2; }
      .titleText { font: 700 24px system-ui, -apple-system, &quot;Segoe UI&quot;, Roboto, Arial, sans-serif; fill: #0f172a; }
      .subText { font: 400 14px system-ui, -apple-system, &quot;Segoe UI&quot;, Roboto, Arial, sans-serif; fill: #334155; }
      .boxTitle { font: 700 15px system-ui, -apple-system, &quot;Segoe UI&quot;, Roboto, Arial, sans-serif; fill: #0f172a; }
      .boxText { font: 400 14px system-ui, -apple-system, &quot;Segoe UI&quot;, Roboto, Arial, sans-serif; fill: #0f172a; }
      .smallText { font: 400 12px system-ui, -apple-system, &quot;Segoe UI&quot;, Roboto, Arial, sans-serif; fill: #334155; }
      .warnText { font: 400 12px system-ui, -apple-system, &quot;Segoe UI&quot;, Roboto, Arial, sans-serif; fill: #7c2d12; }
      .supportText { font: 400 13px system-ui, -apple-system, &quot;Segoe UI&quot;, Roboto, Arial, sans-serif; fill: #7f1d1d; }
      .resultText { font: 700 13px system-ui, -apple-system, &quot;Segoe UI&quot;, Roboto, Arial, sans-serif; fill: #166534; }
      .labelText { font: 700 12px system-ui, -apple-system, &quot;Segoe UI&quot;, Roboto, Arial, sans-serif; fill: #475569; }
      .conn { stroke: #475569; stroke-width: 2.2; fill: none; }
      a:hover .action { fill: #f8fafc; stroke: #0369a1; }
    </style>
    <marker
