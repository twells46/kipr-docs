  <title
     id="title">I can't connect to the controller — troubleshooting flowchart</title>
  <desc
     id="desc">Flowchart for diagnosing controller connection problems based on whether BotUI About shows a non-empty or empty SSID and IP address.</desc>
  <defs
     id="defs1">
    <marker
       id="arrow"
       viewBox="0 0 10 10"
       refX="9"
       refY="5"
       markerWidth="8"
       markerHeight="8"
       orient="auto-start-reverse">
      <path
         d="M 0 0 L 10 5 L 0 10 z"
         fill="#3f4a5a"
         id="path1" />
    </marker>
    <style
       id="style1">
  .bg { fill: #ffffff; }
  .title { font: 700 22px Arial, Helvetica, sans-serif; fill: #172033; }
  .subtitle { font: 14px Arial, Helvetica, sans-serif; fill: #4d5a6b; }
  .box { fill: #f7f9fc; stroke: #617089; stroke-width: 1.4; rx: 12; }
  .action { fill: #eef6ff; stroke: #3e78b2; stroke-width: 1.5; rx: 12; }
  .fix { fill: #effaf2; stroke: #3d8b55; stroke-width: 1.5; rx: 12; }
  .warn { fill: #fff8e8; stroke: #bf7b18; stroke-width: 1.5; rx: 12; }
  .decision { fill: #fff4f4; stroke: #b84e55; stroke-width: 1.5; }
  .terminal { fill: #172033; stroke: #172033; stroke-width: 1.5; rx: 18; }
  .small { font: 12px Arial, Helvetica, sans-serif; fill: #5b6572; }
  .text { font: 13.5px Arial, Helvetica, sans-serif; fill: #1d2737; }
  .terminalText { font: 700 13.5px Arial, Helvetica, sans-serif; fill: #ffffff; }
  .label { font: 700 12px Arial, Helvetica, sans-serif; fill: #3f4a5a; }
  .line { fill: none; stroke: #3f4a5a; stroke-width: 1.6; marker-end: url(#arrow); }
  .lineNoArrow { fill: none; stroke: #3f4a5a; stroke-width: 1.6; }
  .dash { fill: none; stroke: #617089; stroke-width: 1.4; stroke-dasharray: 5 4; }
</style>
  </defs>
  <text
     class="title"
     x="390"
     y="34"
     text-anchor="middle"
     id="text1">I can’t connect to the controller</text>
  <text
     class="subtitle"
     x="390"
     y="56"
     text-anchor="middle"
     id="text2">Diagnose from BotUI → About → WiFi line</text>
  <!-- Start -->
  <rect
     class="terminal"
     x="250"
     y="82"
     width="280"
     height="54"
     id="rect2" />
  <text
     class="terminalText"
     x="390"
     y="105"
     text-anchor="middle"
     id="text3"><tspan
       x="390"
       dy="0"
       id="tspan2">Problem:</tspan><tspan
       x="390"
       dy="17"
       id="tspan3">computer won’t connect</tspan></text>
  <line
     class="line"
     x1="390"
     y1="136"
     x2="390"
     y2="166"
     id="line3" />
  <rect
     class="action"
     x="220"
     y="166"
     width="340"
     height="76"
     id="rect3" />
  <text
     class="text"
     x="390"
     y="191"
     text-anchor="middle"
     id="text6"><tspan
       x="390"
       dy="0"
       id="tspan4">Open BotUI About page</tspan><tspan
       x="390"
       dy="18"
       id="tspan5">Check whether SSID and IP Address</tspan><tspan
       x="390"
       dy="18"
       id="tspan6">are displayed on the WiFi line.</tspan></text>
  <line
     class="line"
     x1="390"
     y1="242"
     x2="390"
     y2="276"
     id="line6" />
  <!-- Decision -->
  <polygon
     class="decision"
     points="390,276 540,356 390,436 240,356"
     id="polygon6" />
  <text
     class="text"
     x="390"
     y="342"
     text-anchor="middle"
     id="text8"><tspan
       x="390"
       dy="0"
       id="tspan7">Are SSID, Password,</tspan><tspan
       x="390"
       dy="18"
       id="tspan8">and IP Address shown?</tspan></text>
  <!-- Branch labels -->
  <line
     class="line"
     x1="240"
     y1="356"
     x2="95"
     y2="356"
     id="line8" />
  <text
     class="label"
     x="164"
     y="342"
     text-anchor="middle"
     id="text9">No: empty SSID</text>
  <line
     class="line"
     x1="540"
     y1="356"
     x2="685"
     y2="356"
     id="line9" />
  <text
     class="label"
     x="616"
     y="342"
     text-anchor="middle"
     id="text10">Yes: non-empty SSID</text>
  <!-- Left branch: Empty SSID -->
  <rect
     class="warn"
     x="25"
     y="386"
     width="270"
     height="102"
     id="rect10" />
  <text
     class="text"
     x="160"
     y="411"
     text-anchor="middle"
     id="text13"><tspan
       x="160"
       dy="0"
       id="tspan10">Empty SSID / Password / IP</tspan><tspan
       x="160"
       dy="18"
       id="tspan11">Known issue on 31.0.0–31.1.2.</tspan><tspan
       x="160"
       dy="18"
       id="tspan12">Fixed in latest recommended</tspan><tspan
       x="160"
       dy="18"
       id="tspan13">version: 31.2.0.</tspan></text>
  <line
     class="line"
     x1="160"
     y1="488"
     x2="160"
     y2="522"
     id="line13" />
  <polygon
     class="decision"
     points="160,522 275,586 160,650 45,586"
     id="polygon13" />
  <text
     class="text"
     x="160"
     y="580"
     text-anchor="middle"
     id="text15"><tspan
       x="160"
       dy="0"
       id="tspan14">Can you update</tspan><tspan
       x="160"
       dy="18"
       id="tspan15">now?</tspan></text>
  <line
     class="line"
     x1="160"
     y1="650"
     x2="160"
     y2="684"
     id="line15" />
  <text
     class="label"
     x="181"
     y="672"
     id="text16">Yes</text>
  <rect
     class="fix"
     x="40"
     y="684"
     width="240"
     height="74"
     id="rect16" />
  <text
     class="text"
     x="160"
     y="710"
     text-anchor="middle"
     id="text18"><tspan
       x="160"
       dy="0"
       id="tspan16">Update firmware using</tspan><tspan
       x="160"
       dy="18"
       id="tspan17">the Wombat update instructions.</tspan><tspan
       x="160"
       dy="18"
       id="tspan18">Permanent fix.</tspan></text>
  <line
     class="line"
     x1="160"
     y1="758"
     x2="160"
     y2="788"
     id="line18" />
  <rect
     class="terminal"
     x="70"
     y="788"
     width="180"
     height="50"
     id="rect18" />
  <text
     class="terminalText"
     x="160"
     y="817"
     text-anchor="middle"
     id="text19">Try connecting again</text>
  <line
     class="line"
     x1="45"
     y1="586"
     x2="22"
     y2="586"
     id="line19" />
  <line
     class="lineNoArrow"
     x1="22"
     y1="586"
     x2="22"
     y2="872"
     id="line20" />
  <line
     class="line"
     x1="22"
     y1="872"
     x2="40"
     y2="872"
     id="line21" />
  <text
     class="label"
     x="34"
     y="574"
     id="text21">No</text>
  <rect
     class="action"
     x="40"
     y="858"
     width="270"
     height="174"
     id="rect21" />
  <text
     class="text"
     x="175"
     y="884"
     text-anchor="middle"
     id="text27"><tspan
       x="175"
       dy="0"
       id="tspan21">Temporary network re-enable</tspan><tspan
       x="175"
       dy="21"
       id="tspan22">Settings → Hide UI</tspan><tspan
       x="175"
       dy="18"
       id="tspan23">Tap red “X” icon</tspan><tspan
       x="175"
       dy="18"
       id="tspan24">Tap “Enable Network”</tspan><tspan
       x="175"
       dy="18"
       id="tspan25">Select network matching</tspan><tspan
       x="175"
       dy="18"
       id="tspan26">controller serial number</tspan><tspan
       x="175"
       dy="18"
       id="tspan27">Return to BotUI → About</tspan></text>
  <line
     class="line"
     x1="175"
     y1="1032"
     x2="175"
     y2="1064"
     id="line27" />
  <rect
     class="warn"
     x="42"
     y="1064"
     width="266"
     height="82"
     id="rect27" />
  <text
     class="text"
     x="175"
     y="1090"
     text-anchor="middle"
     id="text30"><tspan
       x="175"
       dy="0"
       id="tspan28">Network info should appear.</tspan><tspan
       x="175"
       dy="18"
       id="tspan29">This is temporary and will</tspan><tspan
       x="175"
       dy="18"
       id="tspan30">almost certainly break again.</tspan></text>
  <line
     class="line"
     x1="175"
     y1="1146"
     x2="175"
     y2="1180"
     id="line30" />
  <rect
     class="fix"
     x="55"
     y="1180"
     width="240"
     height="72"
     id="rect30" />
  <text
     class="text"
     x="175"
     y="1206"
     text-anchor="middle"
     id="text33"><tspan
       x="175"
       dy="0"
       id="tspan31">Recommended:</tspan><tspan
       x="175"
       dy="18"
       id="tspan32">update to latest version</tspan><tspan
       x="175"
       dy="18"
       id="tspan33">31.2.0 when possible.</tspan></text>
  <!-- Right branch: Non-empty SSID -->
  <rect
     class="action"
     x="485"
     y="386"
     width="270"
     height="80"
     id="rect33" />
  <text
     class="text"
     x="620"
     y="412"
     text-anchor="middle"
     id="text36"><tspan
       x="620"
       dy="0"
       id="tspan34">Computer must be connected</tspan><tspan
       x="620"
       dy="18"
       id="tspan35">to the controller’s network.</tspan><tspan
       x="620"
       dy="18"
       id="tspan36">Verify the WiFi network first.</tspan></text>
  <line
     class="line"
     x1="620"
     y1="466"
     x2="620"
     y2="500"
     id="line36" />
  <rect
     class="action"
     x="485"
     y="500"
     width="270"
     height="86"
     id="rect36" />
  <text
     class="text"
     x="620"
     y="525"
     text-anchor="middle"
     id="text39"><tspan
       x="620"
       dy="0"
       id="tspan37">Visit the exact address:</tspan><tspan
       x="620"
       dy="20"
       id="tspan38">displayed IP + colon + port</tspan><tspan
       x="620"
       dy="20"
       id="tspan39">Example: 192.168.125.1:8888</tspan></text>
  <line
     class="line"
     x1="620"
     y1="586"
     x2="620"
     y2="620"
     id="line39" />
  <polygon
     class="decision"
     points="620,620 745,692 620,764 495,692"
     id="polygon39" />
  <text
     class="text"
     x="620"
     y="677"
     text-anchor="middle"
     id="text42"><tspan
       x="620"
       dy="0"
       id="tspan40">Is IP non-empty</tspan><tspan
       x="620"
       dy="18"
       id="tspan41">and not</tspan><tspan
       x="620"
       dy="18"
       id="tspan42">192.168.125.1?</tspan></text>
  <line
     class="line"
     x1="495"
     y1="692"
     x2="385"
     y2="692"
     id="line42" />
  <text
     class="label"
     x="438"
     y="678"
     text-anchor="middle"
     id="text43">Yes</text>
  <rect
     class="fix"
     x="345"
     y="650"
     width="120"
     height="84"
     id="rect43" />
  <text
     class="text"
     x="405"
     y="675"
     text-anchor="middle"
     id="text45"><tspan
       x="405"
       dy="0"
       id="tspan43">Ethernet or</tspan><tspan
       x="405"
       dy="18"
       id="tspan44">client mode:</tspan><tspan
       x="405"
       dy="18"
       id="tspan45">fix network</tspan></text>
  <line
     class="line"
     x1="405"
     y1="734"
     x2="405"
     y2="784"
     id="line45" />
  <rect
     class="action"
     x="320"
     y="784"
     width="180"
     height="110"
     id="rect45" />
  <text
     class="text"
     x="410"
     y="810"
     text-anchor="middle"
     id="text49"><tspan
       x="410"
       dy="0"
       id="tspan46">Unplug unused</tspan><tspan
       x="410"
       dy="18"
       id="tspan47">ethernet cables.</tspan><tspan
       x="410"
       dy="21"
       id="tspan48">Settings → Advanced</tspan><tspan
       x="410"
       dy="18"
       id="tspan49">→ Network → AP Mode</tspan></text>
  <line
     class="lineNoArrow"
     x1="410"
     y1="894"
     x2="410"
     y2="928"
     id="line49" />
  <line
     class="lineNoArrow"
     x1="410"
     y1="928"
     x2="620"
     y2="928"
     id="line50" />
  <line
     class="line"
     x1="620"
     y1="764"
     x2="620"
     y2="928"
     id="line51" />
  <text
     class="label"
     x="644"
     y="792"
     id="text51">No</text>
  <rect
     class="action"
     x="485"
     y="928"
     width="270"
     height="92"
     id="rect51" />
  <text
     class="text"
     x="620"
     y="954"
     text-anchor="middle"
     id="text53"><tspan
       x="620"
       dy="0"
       id="tspan51">If WiFi and address are correct</tspan><tspan
       x="620"
       dy="18"
       id="tspan52">but browser is blank, suspect</tspan><tspan
       x="620"
       dy="18"
       id="tspan53">signal congestion.</tspan></text>
  <line
     class="line"
     x1="620"
     y1="1020"
     x2="620"
     y2="1054"
     id="line53" />
  <rect
     class="fix"
     x="485"
     y="1054"
     width="270"
     height="92"
     id="rect53" />
  <text
     class="text"
     x="620"
     y="1080"
     text-anchor="middle"
     id="text56"><tspan
       x="620"
       dy="0"
       id="tspan54">Move to a less crowded room</tspan><tspan
       x="620"
       dy="18"
       id="tspan55">or step outside to load the IDE.</tspan><tspan
       x="620"
       dy="18"
       id="tspan56">Then update firmware permanently.</tspan></text>
  <line
     class="line"
     x1="620"
     y1="1146"
     x2="620"
     y2="1180"
     id="line56" />
  <polygon
     class="decision"
     points="620,1180 745,1250 620,1320 495,1250"
     id="polygon56" />
  <text
     class="text"
     x="620"
     y="1236"
     text-anchor="middle"
     id="text59"><tspan
       x="620"
       dy="0"
       id="tspan57">School/company</tspan><tspan
       x="620"
       dy="18"
       id="tspan58">managed device?</tspan><tspan
       x="620"
       dy="18"
       id="tspan59">Test phone.</tspan></text>
  <line
     class="line"
     x1="495"
     y1="1250"
     x2="370"
     y2="1250"
     id="line59" />
  <text
     class="label"
     x="509.12973"
     y="1206.0109"
     text-anchor="middle"
     id="text60"
     style="font-style:normal;font-variant:normal;font-weight:700;font-stretch:normal;font-size:12px;line-height:normal;font-family:Arial, Helvetica, sans-serif">Works on phone</text>
  <rect
     class="warn"
     x="315"
     y="1208"
     width="150"
     height="84"
     id="rect60" />
  <text
     class="text"
     x="390"
     y="1234"
     text-anchor="middle"
     id="text62"><tspan
       x="390"
       dy="0"
       id="tspan60">Request IT to</tspan><tspan
       x="390"
       dy="18"
       id="tspan61">unblock the</tspan><tspan
       x="390"
       dy="18"
       id="tspan62">controller IP.</tspan></text>
  <line
     class="line"
     x1="620"
     y1="1320"
     x2="620"
     y2="1354"
     id="line62" />
  <text
     class="label"
     x="645"
     y="1340"
     id="text63">No / unsure</text>
  <rect
     class="fix"
     x="485"
     y="1354"
     width="270"
     height="58"
     id="rect63" />
  <text
     class="text"
     x="620"
     y="1379"
     text-anchor="middle"
     id="text64"><tspan
       x="620"
       dy="0"
       id="tspan63">If still unresolved:</tspan><tspan
       x="620"
       dy="18"
       id="tspan64">update firmware if not current.</tspan></text>
  <!-- Cross-link from IT block to update -->
  <path
     class="dash"
     d="M 390 1292 C 390 1370, 475 1383, 485 1383"
     id="path64" />
</svg>
