{{ define "main" }}
  <div class="content-shell">
    <aside>
      {{ partial "sidebar-nav.html" . }}
    </aside>

    <article>
      {{ partial "breadcrumbs.html" . }}

      <h1>{{ .Title }}</h1>

      {{ with .Description }}
        <p>{{ . }}</p>
      {{ end }}

      {{ .Content }}

      {{ partial "page-list.html" . }}
    </article>
  </div>
{{ end }}
