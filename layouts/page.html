{{ define "main" }}
  <div class="content-shell">
    <aside>
      {{ partial "sidebar-nav.html" . }}
    </aside>

    <article>
      {{ partial "breadcrumbs.html" . }}

      <h1>{{ .Title }}</h1>

      {{ with .Description }}
        <p>{{ . }}</p>
      {{ end }}

      {{ if (in .TableOfContents "<li>") }}
        <nav aria-label="On this page">
          {{ .TableOfContents }}
        </nav>
      {{ end }}

      {{ .Content }}
    </article>
  </div>
{{ end }}
