<header>
  <div class="site-header-inner">
    <a class="site-title" href="{{ site.Home.RelPermalink }}">{{ site.Title }}</a>

    <nav aria-label="Main navigation">
      {{ range site.Home.Sections.ByWeight }}
        <a href="{{ .RelPermalink }}">{{ .LinkTitle }}</a>
      {{ end }}
    </nav>
  </div>
</header>
