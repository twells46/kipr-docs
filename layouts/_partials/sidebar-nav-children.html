{{ $current := .current }}

{{ with .section.Pages }}
  <ul>
    {{ range .ByWeight }}
      <li>
        <a href="{{ .RelPermalink }}"{{ if eq .RelPermalink $current.RelPermalink }} aria-current="page"{{ end }}>
          {{ .LinkTitle }}
        </a>

        {{ if .IsSection }}
          {{ partial "sidebar-nav-children.html" (dict "section" . "current" $current) }}
        {{ end }}
      </li>
    {{ end }}
  </ul>
{{ end }}
