<!doctype html>
<html lang="{{ site.Language.Locale }}">
<head>
  {{ partial "head.html" . }}
</head>
<body>

  {{ partial "site-header.html" . }}

  <main id="main">
    <div class="content-shell">
      <aside>
        {{ partial "sidebar-nav.html" . }}
      </aside>

      <article>
        {{ partial "breadcrumbs.html" . }}

        <h1>{{ .Title }}</h1>

        {{ with .Description }}
          <p>{{ . }}</p>
        {{ end }}

        {{ block "main" . }}{{ end }}
      </article>
    </div>
  </main>
</body>
</html>
