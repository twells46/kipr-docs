{{ define "main" }}
  <div class="docs-shell">
    <aside>
      {{ partial "docs-nav.html" . }}
    </aside>
  <article>
    <h1>{{ .Title }}</h1>

    {{ with .Description }}
      <p>{{ . }}</p>
    {{ end }}

    {{ .Content }}

      <section>
        {{ partial "page-list.html" . }}
      </section>
  </article>
  </div>
{{ end }}
