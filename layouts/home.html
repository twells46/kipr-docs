{{ define "main" }}
  <article>
    <h1>{{ .Title }}</h1>

    {{ with .Description }}
      <p>{{ . }}</p>
    {{ end }}

    {{ .Content }}

      <section>
        <h2 id="docs-heading">
          <a href="{{ .RelPermalink }}">{{ .Title }}</a>
        </h2>

        {{ with .Description }}
          <p>{{ . }}</p>
        {{ end }}

        {{ partial "page-list.html" . }}
      </section>
  </article>
{{ end }}
